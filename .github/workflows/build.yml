name: Build & Test

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  build-ios:
    name: Build iOS 26
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 26
        run: sudo xcode-select -s /Applications/Xcode_26.0.app/Contents/Developer

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build iOS
        run: |
          xcodebuild build \
            -project OpenRouterChat.xcodeproj \
            -scheme OpenRouterChat \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro,OS=26.0' \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO

      - name: Test iOS
        run: |
          xcodebuild test \
            -project OpenRouterChat.xcodeproj \
            -scheme OpenRouterChat \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro,OS=26.0' \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO

  build-macos:
    name: Build macOS 26
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 26
        run: sudo xcode-select -s /Applications/Xcode_26.0.app/Contents/Developer

      - name: Build macOS
        run: |
          xcodebuild build \
            -project OpenRouterChat.xcodeproj \
            -scheme OpenRouterChat \
            -destination 'platform=macOS,arch=arm64' \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO

  build-macos-ui-tests:
    name: UI Tests macOS 26
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 26
        run: sudo xcode-select -s /Applications/Xcode_26.0.app/Contents/Developer

      - name: Run UI Tests
        run: |
          xcodebuild test \
            -project OpenRouterChat.xcodeproj \
            -scheme OpenRouterChat \
            -destination 'platform=macOS,arch=arm64' \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO

  lint:
    name: SwiftLint
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Run SwiftLint
        run: swiftlint lint --reporter github-actions-logging
