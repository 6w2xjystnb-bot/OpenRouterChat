name: Build & Test

on:
  push:
    branches: [main, develop, feature/macos-ios-ci]
  pull_request:
    branches: [main]

jobs:
  build-ios:
    name: Build iOS 26
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 26
        run: sudo xcode-select -s /Applications/Xcode_26.0.app/Contents/Developer

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build iOS
        run: |
          xcodebuild build \
            -project OpenRouterChat.xcodeproj \
            -scheme OpenRouterChat \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,OS=26.5' \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO

  lint:
    name: SwiftLint
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Run SwiftLint
        run: swiftlint lint --reporter github-actions-logging || true
